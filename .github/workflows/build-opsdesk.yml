name: Build OpsDesk (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "ops-v*"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: opsdesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --windowed --name OpsDesk --collect-all psutil app.py
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/OpsDesk/* -DestinationPath "OpsDesk-${{ github.ref_name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: OpsDesk-Windows
          path: opsdesk/OpsDesk-${{ github.ref_name }}.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/ops-v')
        uses: softprops/action-gh-release@v2
        with:
          files: opsdesk/OpsDesk-${{ github.ref_name }}.zip
